<!DOCTYPE html>
<html>

<head>
  <title>Homnix</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="stylesheet" href="style.css"/>
</head>

<body>

  <!-- SPLASH -->
  <div id="splash">

    <h1>HOMNIX</h1>

    <p>2025</p>

  </div>

  <!-- LOGIN -->
  <div id="login" class="hidden">

    <h2>Welcome to Homnix</h2>

    <input type="text" placeholder="Mobile Number"/>

    <button onclick="showHome()">
      Send OTP
    </button>

  </div>

  <!-- HOME -->
  <div id="home" class="hidden">

    <div class="topbar">

      <h1>Homnix</h1>

      <div class="profile">
        👤
      </div>

    </div>

    <!-- SERVICES -->

    <div class="services">

      <div class="card">
        Cleaning
      </div>

      <div class="card">
        Plumbing
      </div>

      <div class="card">
        Electrician
      </div>

      <div class="card">
        Painting
      </div>

    </div>

    <!-- BOOKING -->

    <div class="booking">

      <h2>Book Service</h2>

      <input type="text" placeholder="Location"/>

      <textarea placeholder="Describe your issue"></textarea>

      <button>
        Confirm Booking
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
